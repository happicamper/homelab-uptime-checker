name: Scan pipeline

on:
  push: # trigger when pushed to main
    branches: [main] 
  pull_request: # trigger upon pull request
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  ECR_REPO: homelab-ecr/node
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_VERSION: 1.0.${{ github.run_number }}

jobs:
  secrets:
    name: secrets-scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Trivy fs scan report (json)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs.json

      - name: Convert to human-readable format(table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: convert
          scan-ref: trivy-fs.json
          format: table
          output: trivy-fs.txt

      - name: convert to sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: convert
          scan-ref: trivy-fs.json
          format: sarif
          output: trivy-fs.sarif
      
      - name: Show summary report
        if: always()
        run: |
          {
            echo "Trivy summary report"
            echo "---------------------------"
            cat trivy-fs.sarif
            echo "---------------------------"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #update-v4.39.3
        with:
          sarif_file: trivy-fs.sarif

      - name: Upload Trivy results as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-fs-report
          path: |
            trivy-fs.json
            trivy-fs.txt
            trivy-fs.sarif
          retention-days: 30
      
      - name: Trivy scan(Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  sast:
    name: SAST using Semgrep
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      SEMGREP_RULES: p/docker p/python p/secrets p/owasp-top-ten
    container:
      image: semgrep/semgrep@sha256:25251de66c3b0fdea1c1c519bbc130170349f3da79edd517335b847f30d3c493 # v1.186.0
    steps:
      - name: checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Semgrep scan
        id: scan
        continue-on-error: true
        run: |
          semgrep ci \
            --json-output=semgrep.json \
            --sarif-output=semgrep.sarif \
            --text-output=semgrep.txt
      
      - name: Upload SARIF to Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #update-v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep outputs as Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: |
            semgrep.json \
            semgrep.sarif \
            semgrep.txt 
          retention-days: 30
      - name: Semgrep Scan Gate
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
            data = json.load(open("semgrep.json"))
          except Exception as e:
            sys.exit(f"Semgrep did not produce a valid report: {e}")
          errors = [r for r in data["results"] if r["extra"]["severity"] == "ERROR"]
          for r in errors:
            print(f'{r["path"]}:{r["start"]["line"]} {r["check_id"]}')
          sys.exit(1 if errors else 0)
          EOF